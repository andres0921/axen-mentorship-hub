<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Sign in · AXEN Mentorship Hub</title>
  <link rel="icon" href="/assets/axen-logo-white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script type="module" src="/src/auth/confirm.js"></script>
</head>
<body class="bg-navy-900 text-navy-900 font-sans antialiased min-h-screen flex items-center justify-center p-4">
  <main class="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl text-center">
    <img src="/assets/axen-logo-white.png" alt="AXEN Realty" class="h-10 mx-auto mb-3 bg-navy-900 rounded-lg p-1">
    <h1 class="font-display text-2xl">AXEN Mentorship Hub</h1>

    <!-- Shown when the link carries a token: one click to sign in.
         The click is required so email link scanners can't consume the one-time token. -->
    <section id="confirm-ready" class="hidden mt-6 space-y-4">
      <p class="text-sm text-navy-700/80">Tap the button to finish signing in.</p>
      <button type="button" id="confirm-continue" class="w-full btn-primary py-3 rounded-xl text-base">Continue</button>
    </section>

    <section id="confirm-working" class="mt-6 text-sm text-navy-700/70">Checking your link…</section>

    <section id="confirm-pending" class="hidden mt-6 space-y-3">
      <p class="font-medium">Your account isn’t set up yet.</p>
      <p class="text-sm text-navy-700/70">You’re signed in, but this account has no access. Contact your mentor or the program admin.</p>
      <button type="button" id="confirm-signout" class="text-sm px-4 py-2 rounded-lg border border-navy-200">Sign out</button>
    </section>

    <section id="confirm-error" class="hidden mt-6 space-y-4">
      <p id="confirm-error-text" class="text-sm text-red-700"></p>
      <div class="flex flex-col gap-2 text-sm">
        <a href="/mentee/" class="w-full py-3 rounded-xl border border-navy-200">Mentee? Request a new sign-in link</a>
        <a href="/" class="w-full py-3 rounded-xl border border-navy-200">Mentor sign-in</a>
      </div>
    </section>
  </main>
</body>
</html>
